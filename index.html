<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#081019">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>バトル確認</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      --bg: #081019;
      --card: #13212e;
      --border: #294151;
      --text: #f3f8fc;
      --sub: #a8bdc9;
      --accent: #bbf2b0;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--bg); color: var(--text); overscroll-behavior: none; }
    button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button:focus-visible { outline: 4px solid #e4faff; outline-offset: -7px; }
    .screen {
      height: 100vh;
      height: 100dvh;
      width: 100%;
      max-width: 1800px;
      margin-inline: auto;
      padding: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      display: grid;
      grid-template-rows: repeat(3, minmax(0,1fr));
      gap: clamp(12px, 2vh, 22px);
    }
    .check {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      min-height: 0;
      padding: clamp(20px, 3.5vw, 50px);
      border: 2px solid var(--border);
      border-radius: 24px;
      background: var(--card);
      display: flex;
      align-items: center;
      text-align: left;
      color: var(--text);
      gap: clamp(16px, 3vw, 40px);
      transition: background .12s ease, border-color .12s ease, transform .1s ease;
    }
    .check:active { transform: scale(.996); }
    .check[aria-pressed="true"] { background: #193c35; border-color: #88dfaa; }
    .number {
      font-size: clamp(27px, 3vw, 42px);
      font-weight: 800;
      letter-spacing: -.05em;
      color: #7093a7;
      flex: none;
      font-variant-numeric: tabular-nums;
    }
    .check[aria-pressed="true"] .number { color: #8bdca7; }
    .copy { display: flex; flex-direction: column; gap: clamp(6px, 1.3vh, 13px); min-width: 0; flex: 1; }
    .question {
      font-weight: 850;
      letter-spacing: -.04em;
      font-size: clamp(28px, 3.3vw, 49px);
      line-height: 1.25;
      word-break: keep-all;
    }
    .hint {
      color: var(--sub);
      font-size: clamp(16px, 1.75vw, 23px);
      font-weight: 570;
      line-height: 1.4;
      word-break: keep-all;
    }
    .check[aria-pressed="true"] .hint { color: #b7d5c9; }
    .mark {
      width: clamp(42px, 5.8vw, 76px);
      height: clamp(42px, 5.8vw, 76px);
      border-radius: 50%;
      border: 2px solid #4b6474;
      display: grid;
      place-items: center;
      flex: none;
      color: transparent;
    }
    .mark svg { width: 54%; height: 54%; }
    .check[aria-pressed="true"] .mark { border-color: var(--accent); background: var(--accent); color: #143125; }
    .screen.completed .check { background: #204a3d; border-color: var(--accent); }
    @media (max-height: 670px) and (min-width: 790px) {
      .screen { padding-top: 12px; padding-bottom: 12px; gap: 10px; }
      .check { padding: 15px 28px; border-radius: 18px; }
      .question { font-size: clamp(26px, 3vw, 39px); }
      .hint { font-size: clamp(15px, 1.6vw, 21px); }
    }
    @media (max-width: 790px) and (orientation: portrait) {
      .screen { padding: 12px; gap: 10px; }
      .check { padding: 14px 18px; gap: 13px; border-radius: 17px; }
      .number { font-size: 23px; }
      .question { font-size: clamp(20px, 4vw, 30px); }
      .hint { font-size: clamp(12px, 2.5vw, 17px); }
      .mark { width: 36px; height: 36px; }
    }
    @media (prefers-reduced-motion: reduce) { .check { transition: none; } }
  </style>
</head>
<body>
  <main class="screen" id="screen" aria-label="技の選択前に3つ確認する">
    <button class="check" type="button" aria-pressed="false">
      <span class="number" aria-hidden="true">01</span>
      <span class="copy">
        <span class="question">相手から止められないか？</span>
        <span class="hint">ねこだまし・まもる・交代</span>
      </span>
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 6"/></svg></span>
    </button>
    <button class="check" type="button" aria-pressed="false">
      <span class="number" aria-hidden="true">02</span>
      <span class="copy">
        <span class="question">技は今、通る？</span>
        <span class="hint">フィールド・天候・技の対象</span>
      </span>
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 6"/></svg></span>
    </button>
    <button class="check" type="button" aria-pressed="false">
      <span class="number" aria-hidden="true">03</span>
      <span class="copy">
        <span class="question">本当に先に動ける？</span>
        <span class="hint">トリックルーム・おいかぜ・優先度</span>
      </span>
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 6"/></svg></span>
    </button>
  </main>
  <script>
    (() => {
      'use strict';
      const screen = document.getElementById('screen');
      const checks = [...document.querySelectorAll('.check')];
      let resetHandle = null;
      function reset() {
        clearTimeout(resetHandle);
        resetHandle = null;
        screen.classList.remove('completed');
        for (const check of checks) check.setAttribute('aria-pressed','false');
      }
      for (const check of checks) {
        check.addEventListener('click', () => {
          if (resetHandle !== null) return;
          check.setAttribute('aria-pressed', check.getAttribute('aria-pressed') !== 'true' ? 'true' : 'false');
          if (checks.every(x => x.getAttribute('aria-pressed') === 'true')) {
            screen.classList.add('completed');
            // 全項目を確認したことを一瞬表示し、次のターンへ自動的に戻す。
            resetHandle = setTimeout(reset, 650);
          }
        });
      }
    })();
  </script>
</body>
</html>
